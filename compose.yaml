version: '3.8'

services:
  db: 
    image: postgres:15-alpine
    container_name: agua-fix-api
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_db:/var/lib/postgresql/data

  api:
    image: majirriz20/agua-fix-api:latest
    container_name: aguafix-api
    restart: always
    depends_on:
      - db
    environment:
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PORT=5432
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAINTENANCE_CREW_EMAIL=${MAINTENANCE_CREW_EMAIL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
    ports:
      - "3000:3000"

volumes:
  postgres_data_db: